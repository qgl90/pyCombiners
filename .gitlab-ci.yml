stages:
  - check
  - test
  - pipelines

check-formatting:
  stage: check
  image: python:3.12
  before_script:
    - pip install ruff
  script:
    - ruff format .
    - |
      if ! git diff --quiet; then
        git config user.name "GitLab CI"
        git config user.email "noreply@gitlab.com"
        git add -A
        git commit -m "Format Python code"
        git format-patch -1 --stdout > format.patch
        echo -e "\nTo fix, run:"
        echo "  pip install ruff && ruff format ."
        echo "or:"
        echo "  curl -L \"${CI_JOB_URL}/artifacts/raw/format.patch\" | git am"
        exit 1
      fi
  artifacts:
    paths:
      - format.patch
    when: on_failure
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

unit-tests:
  stage: test
  image: condaforge/mambaforge:latest
  before_script:
    - mamba env update -n base -f tests/environment.yaml
    - pip install -e . --no-deps
  script:
    - python -m pytest tests/ -v
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

# Physics pipelines: 1k-event smoke runs on the pycombiner VM (shell runner).
# expire_in does not accept variables, hence one job per artifact policy:
# MR artifacts expire after 7 days, main artifacts are kept forever.
.pipeline:
  stage: pipelines
  tags:
    - pyCombiner-cpu
  variables:
    MAMBA_ROOT_PREFIX: /data/micromamba
  before_script:
    - bash ci/ensure_env.sh
  script:
    - /data/micromamba/bin/micromamba run -n run5 snakemake
      --snakefile workflow/${PIPELINE}.smk -c4
      --configfile ci/${PIPELINE}.yaml
  parallel:
    matrix:
      - PIPELINE:
          - bs_to_phigamma
          - calo_study
          - ks_to_pipi
          - bs_to_jpsiphi
          - bs_to_mumu
          - performance_studies
  artifacts:
    paths:
      - public/*/analysis/
      - public/*/reconstruction/*.log
    when: always

pipeline:
  extends: .pipeline
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  artifacts:
    expire_in: 7 days

pipeline-main:
  extends: .pipeline
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  artifacts:
    expire_in: never
