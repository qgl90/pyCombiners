stages:
  - check
  - test

check-formatting:
  stage: check
  image: python:3.12
  before_script:
    - pip install ruff
  script:
    - ruff format .
    - |
      if ! git diff --quiet; then
        git config user.name "GitLab CI"
        git config user.email "noreply@gitlab.com"
        git add -A
        git commit -m "Format Python code"
        git format-patch -1 --stdout > format.patch
        echo -e "\nTo fix, run:"
        echo "  pip install ruff && ruff format ."
        echo "or:"
        echo "  curl -L \"${CI_JOB_URL}/artifacts/raw/format.patch\" | git am"
        exit 1
      fi
  artifacts:
    paths:
      - format.patch
    when: on_failure
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

unit-tests:
  stage: test
  image: condaforge/mambaforge:latest
  before_script:
    - mamba env update -n base -f tests/environment.yaml
    - pip install -e . --no-deps
  script:
    - python -m pytest tests/ -v
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
